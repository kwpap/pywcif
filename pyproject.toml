[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "pywcif"
version = "0.1.0"
description = "Typed Pydantic v2 models for WCA WCIF v1.2"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kostantinos Papadopoulos" }]
dependencies = ["pydantic>=2.6.0,<3.0.0"]

[project.optional-dependencies]
http = ["httpx>=0.27.0"]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "mypy>=1.10.0",
  "ruff>=0.4.0",
  "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pywcif"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
pretty = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
