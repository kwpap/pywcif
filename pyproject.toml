[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "pywcif"
dynamic = ["version"]
description = "Python library for World Cube Association (WCA) speedcubing competition data (WCIF): schedules, results, groups and checks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kostantinos Papadopoulos" }]
keywords = [
  "wca",
  "wcif",
  "world cube association",
  "speedcubing",
  "cubing",
  "rubiks cube",
  "rubik's cube",
  "puzzle",
  "competition",
  "competition management",
  "speedcubing competition",
  "results",
  "schedule",
  "groups",
  "scorecards",
  "groupifier",
  "wca live",
  "delegate",
  "organizer",
  "fewest moves",
  "multi-blind",
  "pydantic",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment :: Puzzle Games",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["pydantic>=2.6.0,<3.0.0"]

[project.urls]
Homepage = "https://github.com/kwpap/pywcif"
Repository = "https://github.com/kwpap/pywcif"
Issues = "https://github.com/kwpap/pywcif/issues"
Changelog = "https://github.com/kwpap/pywcif/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "mypy>=1.10.0",
  "ruff>=0.4.0",
]

[tool.hatch.version]
path = "src/pywcif/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pywcif"]

[tool.hatch.build.targets.sdist]
exclude = [".github"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
pretty = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = ["live: downloads real WCIFs from the WCA website (opt in with --run-live)"]
