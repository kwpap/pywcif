version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # pywcif is a library: keep minimum versions low so it installs next to other packages.
    # Only propose a change when a new release falls outside the allowed range.
    versioning-strategy: increase-if-necessary
    groups:
      python:
        patterns: ["*"]
